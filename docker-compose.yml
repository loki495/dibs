name: dibs
services:
  app:
    container_name: dibs-app
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    pid: "host"
    volumes:
      - ./:/var/www/html
    ports:
      - "127.0.0.1:${APP_PORT:-8095}:80"
  scheduler:
    container_name: dibs-scheduler
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
  node:
    image: node:22
    profiles: [tools]
    working_dir: /var/www/html
    user: "1000:1000"
    volumes:
      - ./:/var/www/html
