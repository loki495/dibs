# Labels go on `web` (Apache); `app` serves no HTTP. See docker-compose.yml.
services:
  web:
    networks: [default, web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.services.dibs.loadbalancer.server.port=80"
      - "traefik.http.routers.dibs.rule=Host(`dibs.example.com`)"
      - "traefik.http.routers.dibs.entrypoints=websecure"
      - "traefik.http.routers.dibs.tls=true"
      - "traefik.http.routers.dibs.middlewares=dibs-lan"
      # Example ranges: replace with your own LAN subnet and Docker gateway.
      - "traefik.http.middlewares.dibs-lan.ipallowlist.sourcerange=10.0.0.0/24,127.0.0.1/32,172.18.0.1/32"
      - "traefik.http.routers.dibs-http.rule=Host(`dibs.example.com`)"
      - "traefik.http.routers.dibs-http.entrypoints=web"
      - "traefik.http.routers.dibs-http.middlewares=dibs-lan,dibs-https"
      - "traefik.http.middlewares.dibs-https.redirectscheme.scheme=https"
networks:
  web:
    external: true
