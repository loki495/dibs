# Debian ships mod_deflate with a type list that stops at text/* and JavaScript, so Livewire's JSON
# responses (the whole workspace on every interaction, several megabytes of it) left the server
# uncompressed while the HTML page was already gzipped.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json
    AddOutputFilterByType DEFLATE application/ld+json
</IfModule>
